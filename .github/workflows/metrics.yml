# ============================================================================
#  Save as:  .github/workflows/metrics.yml
#  in github.com/Pratham-Dusane/Pratham-Dusane
#
#  SETUP (one time, ~3 minutes):
#    1. Create a classic Personal Access Token:
#       github.com/settings/tokens/new
#       Scopes needed: read:user  (add repo only if you want private repo stats)
#       No expiry, or set a reminder — the workflow fails silently when it lapses.
#    2. In this repository: Settings → Secrets and variables → Actions →
#       New repository secret. Name it METRICS_TOKEN, paste the token.
#    3. Actions tab → "GitHub Metrics" → Run workflow.
#
#  The SVGs are committed straight into this repo, so they're served from
#  raw.githubusercontent.com and can't break the way the vercel widgets did.
# ============================================================================

name: GitHub Metrics

on:
  schedule:
    - cron: "0 2 * * *"      # daily at 02:00 UTC (07:30 IST)
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      # ---------------- Overview card ----------------
      - name: Base metrics (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.base.dark.svg
          user: Pratham-Dusane
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_theme: dark

      - name: Base metrics (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.base.light.svg
          user: Pratham-Dusane
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_theme: light

      # ---------------- Language breakdown ----------------
      - name: Language metrics (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.dark.svg
          user: Pratham-Dusane
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dark
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%

      - name: Language metrics (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.light.svg
          user: Pratham-Dusane
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: light
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%
