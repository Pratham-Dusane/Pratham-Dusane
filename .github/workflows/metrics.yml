# ============================================================================
#  Save as:  .github/workflows/metrics.yml
#  in github.com/Pratham-Dusane/Pratham-Dusane
#
#  SETUP (already done if METRICS_TOKEN exists):
#    1. Classic PAT from github.com/settings/tokens/new, scope: read:user
#    2. Settings -> Secrets and variables -> Actions -> METRICS_TOKEN
#
#  SELECTION RATIONALE:
#  GitHub already renders the contribution calendar natively on the profile
#  page, directly above this README -- so no calendar, isocalendar, or streak
#  widget appears here. Community stats (sponsors, stargazers, organizations,
#  packages) are also excluded: they are structurally zero for a profile built
#  on private and coursework repos, and showing them advertises that.
#
#  What is left is what GitHub does NOT surface on its own:
#    - language distribution across all repos
#    - lines of code added and removed, overall and per repository
#
#  DO NOT RE-ADD plugin_habits / plugin_activity / plugin_code.
#  GitHub stripped `commits` and `size` out of the PushEvent payload returned
#  by GET /users/{user}/events -- it is now only
#  {repository_id, push_id, ref, head, before}. All three plugins read
#  payload.commits unguarded, so they throw a TypeError and render a red
#  "Unexpected error" row in the SVG. No plugin_habits_* option avoids it;
#  the crash is upstream in lowlighter/metrics, not in this config.
#
#  There is no theme option in this action -- `config_theme` is not a real
#  input and was silently ignored, which is why the old dark and light files
#  were byte-for-byte identical. One file is generated; the default palette
#  (grey text, blue headings, transparent background) reads on both themes.
# ============================================================================

name: GitHub Metrics

on:
  schedule:
    - cron: "0 2 * * *"      # daily at 02:00 UTC (07:30 IST)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml   # so the committed SVG cannot re-trigger this

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      - name: Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: Pratham-Dusane
          base: ""
          config_timezone: Asia/Kolkata

          # Language distribution -- your strongest real signal (14 languages)
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%

          # Code volume, overall and per repo
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 4
