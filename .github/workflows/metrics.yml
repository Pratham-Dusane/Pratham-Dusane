# ============================================================================
#  Save as:  .github/workflows/metrics.yml
#  in github.com/Pratham-Dusane/Pratham-Dusane
#
#  SETUP (already done if METRICS_TOKEN exists):
#    1. Classic PAT from github.com/settings/tokens/new, scope: read:user
#    2. Settings -> Secrets and variables -> Actions -> METRICS_TOKEN
#
#  SELECTION RATIONALE:
#  GitHub already renders the contribution calendar natively on the profile
#  page, directly above this README -- so no calendar, isocalendar, or streak
#  widget appears here. Community stats (sponsors, stargazers, organizations,
#  packages) are also excluded: they are structurally zero for a profile built
#  on private and coursework repos, and showing them advertises that.
#
#  What is left is what GitHub does NOT surface on its own:
#    - language distribution across all repos
#    - lines of code added and removed, overall and per repository
#    - commit time-of-day and day-of-week patterns
# ============================================================================

name: GitHub Metrics

on:
  schedule:
    - cron: "0 2 * * *"      # daily at 02:00 UTC (07:30 IST)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      - name: Metrics (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.dark.svg
          user: Pratham-Dusane
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dark

          # Language distribution -- your strongest real signal (14 languages)
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%

          # Code volume, overall and per repo
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 4

          # When you actually write code
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

      - name: Metrics (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.light.svg
          user: Pratham-Dusane
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: light

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%

          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 4

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic