# ============================================================================
#  Save as:  .github/workflows/metrics.yml
#  in github.com/Pratham-Dusane/Pratham-Dusane
#
#  SETUP (one time, ~3 minutes):
#    1. Create a classic Personal Access Token:
#       github.com/settings/tokens/new
#       Scopes needed: read:user  (add repo only if you want private repo stats)
#    2. In this repository: Settings -> Secrets and variables -> Actions ->
#       New repository secret. Name it METRICS_TOKEN, paste the token.
#    3. Actions tab -> "GitHub Metrics" -> Run workflow.
#
#  WHAT THIS SHOWS, AND WHY:
#  The default "classic" template leads with community stats -- sponsors,
#  stargazers, organizations, packages -- which read as a wall of zeros on a
#  profile that is heavy on private and coursework repos. This config drops all
#  of it and keeps only the metrics that reflect real output: contribution
#  calendar, lines of code, language distribution, and commit habits.
# ============================================================================

name: GitHub Metrics

on:
  schedule:
    - cron: "0 2 * * *"      # daily at 02:00 UTC (07:30 IST)
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      # ---------- Card 1: contribution calendar + code volume ----------
      - name: Activity metrics (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.activity.dark.svg
          user: Pratham-Dusane
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dark
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_lines: yes
          plugin_lines_sections: base

      - name: Activity metrics (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.activity.light.svg
          user: Pratham-Dusane
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: light
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_lines: yes
          plugin_lines_sections: base

      # ---------- Card 2: language breakdown + commit habits ----------
      - name: Language metrics (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.dark.svg
          user: Pratham-Dusane
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dark
          config_display: large
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_facts: no

      - name: Language metrics (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.light.svg
          user: Pratham-Dusane
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: light
          config_display: large
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_facts: no
